[project]
name = "hapa-living-comic"
version = "0.1.0"
description = "Local-first Living Comic Book desktop app prototype"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.pytest.ini_options]
pythonpath = ["backend"]
